
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nonnita MRZ Reader Test</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f5ee;color:#123f37;padding:18px;max-width:700px;margin:auto}
video{width:100%;background:#222;border-radius:14px}
button{padding:13px;border:0;border-radius:10px;background:#123f37;color:white;font-size:16px;margin:6px 3px}
#status,pre{background:#e8efe8;padding:12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>Phuket Nonnita</h1>
<h2>Smart Check-In · MRZ Test</h2>
<p>วางแถบ MRZ ด้านล่างของหน้าพาสปอร์ตให้อยู่ในภาพกล้อง</p>
<video id="video" autoplay playsinline muted></video>
<div>
<button id="start">เปิดกล้อง</button>
<button id="scan" disabled>อ่าน MRZ</button>
<button id="stop">ปิดกล้อง</button>
</div>
<div id="status">กดเปิดกล้องเพื่อเริ่มต้น</div>
<h3>ผล OCR</h3>
<pre id="result">ยังไม่มีผลการอ่าน</pre>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const video=document.getElementById('video');
const status=document.getElementById('status');
const result=document.getElementById('result');
let stream=null,worker=null,busy=false;

document.getElementById('start').onclick=async()=>{
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error('ต้องเปิดผ่าน HTTPS');
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:'environment'}},audio:false
  });
  video.srcObject=stream;
  await video.play();
  document.getElementById('scan').disabled=false;
  status.textContent='กล้องพร้อมแล้ว จัดแถบ MRZ ให้อยู่ในภาพ';
 }catch(e){status.textContent='เปิดกล้องไม่สำเร็จ: '+e.message;}
};

document.getElementById('scan').onclick=async()=>{
 if(!stream||busy)return;
 busy=true;
 const btn=document.getElementById('scan');
 btn.disabled=true;
 try{
  status.textContent='กำลังเตรียม OCR อาจใช้เวลาครั้งแรกสักครู่';
  if(!window.Tesseract)throw Error('โหลด OCR ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วโหลดหน้าใหม่');
  if(!worker)worker=await Tesseract.createWorker('eng');
  const canvas=document.createElement('canvas');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  if(!canvas.width)throw Error('ยังไม่มีภาพจากกล้อง');
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0);
  const res=await worker.recognize(canvas);
  const text=(res.data.text||'').toUpperCase();
  result.textContent=text||'ไม่พบตัวอักษร ลองเพิ่มแสงและถือพาสปอร์ตให้นิ่ง';
  status.textContent=text?'อ่านภาพแล้ว กรุณาตรวจตัวอักษรกับพาสปอร์ตจริง':'ยังอ่านไม่พบ ลองจัดตำแหน่งใหม่';
 }catch(e){status.textContent='เกิดข้อผิดพลาด: '+e.message;}
 finally{busy=false;btn.disabled=!stream;}
};

document.getElementById('stop').onclick=()=>{
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.srcObject=null;
 document.getElementById('scan').disabled=true;
 status.textContent='ปิดกล้องแล้ว';
};
window.addEventListener('pagehide',()=>{
 if(stream)stream.getTracks().forEach(t=>t.stop());
 if(worker)worker.terminate();
});
</script>
</body>
</html>
